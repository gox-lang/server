name: Publish container image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing GitHub Release version, without v
        required: true
        default: '0.1.3'
        type: string
      latest:
        description: Also update the latest image tag
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: container-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/gox-lang/server
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested release
        run: printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: docker/setup-buildx-action@v3
      - name: Build release image
        run: docker buildx build --load --platform "linux/$ARCH" --build-arg "GOX_VERSION=$VERSION" -t "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH" .
      - name: Verify native execution and host ownership
        run: python3 scripts/smoke-container.py "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH" --version "$VERSION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image and record digest
        run: |
          tag="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker push "$tag"
          mkdir -p digests
          docker inspect --format '{{index .RepoDigests 0}}' "$tag" > "digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: container-digest-${{ matrix.arch }}
          path: digests/*.txt
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      MAKE_LATEST: ${{ inputs.latest }}
      IMAGE: ghcr.io/gox-lang/server
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: container-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        run: |
          amd64=$(cat digests/amd64.txt)
          arm64=$(cat digests/arm64.txt)
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$amd64" "$arm64"
          if [ "$MAKE_LATEST" = true ]; then
            docker buildx imagetools create -t "$IMAGE:latest" "$amd64" "$arm64"
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION"
