name: Platform compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test CLI and Go toolchain support
        run: go test ./internal/toolchain ./internal/commands/ls ./internal/processrestart
      - name: Build executable
        run: go build -o build/gox.exe .
      - name: Test executable and LSP transport
        run: python scripts/smoke-lsp.py build/gox.exe
