name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript for contract tests
        run: npm install --global typescript@5.9.3
      - name: Test Go packages
        run: go test ./...
      - name: Test Go installation
        run: python3 scripts/smoke-install.py --project
      - name: Test browser runtime
        run: node --test internal/websocket/*.test.js internal/clientbuilder/*.test.mjs
      - name: Vet
        run: go vet ./...
