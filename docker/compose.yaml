# Place this file in the root of an existing GOX project.
services:
  gox:
    image: ${GOX_IMAGE:-ghcr.io/gox-lang/server:latest}
    user: "${GOX_UID:-1000}:${GOX_GID:-1000}"
    command: ["run", "--host", "0.0.0.0", "--port", "3000"]
    working_dir: /workspace
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace
      - toolchains:/var/lib/gox
    init: true
volumes:
  toolchains:
